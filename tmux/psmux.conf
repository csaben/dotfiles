# psmux configuration adapted from /home/ozriel/.tmux.conf

# Keep Clark's tmux muscle memory.
set -g prefix M-b
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
set -sg escape-time 0

# Windows-friendly defaults.
set -g mouse on
set -g mode-keys vi
set -g history-limit 50000
set -g allow-predictions on

# Splits inherit the current pane's working directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload this file with Prefix+r.
bind r source-file ~/.psmux.conf \; display-message "psmux config reloaded"

# Native psmux plugins replacing the Linux TPM equivalents.
set -g @plugin 'psmux-plugins/ppm'
set -g @plugin 'psmux-plugins/psmux-sensible'
set -g @plugin 'psmux-plugins/psmux-resurrect'

# Catppuccin is the default theme; Mocha is its dark flavor.
set -g @catppuccin-flavor 'mocha'
set -g @catppuccin-show-powerline 'on'
set -g @catppuccin-window-style 'rounded'
set -g @plugin 'psmux-plugins/psmux-theme-catppuccin'

# Initialize PPM last.
run '~/.psmux/plugins/ppm/ppm.ps1'
